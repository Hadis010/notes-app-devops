---
- name: Base configuration on all hosts
  hosts: all
  become: true
  roles:
    - role: common
      tags: [common]

- name: Configure application instances
  hosts: app
  become: true
  roles:
    - role: application
      tags: [application]

- name: Configure database instance
  hosts: database
  become: true
  roles:
    - role: database
      tags: [database]

- name: Configure load balancer
  hosts: loadbalancer
  become: true
  roles:
    - role: loadbalancer
      tags: [loadbalancer]

- name: Configure backup
  hosts: backup
  become: true
  roles:
    - role: backup
      tags: [backup]
