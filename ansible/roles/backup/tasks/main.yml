---
- name: Install backup packages
  ansible.builtin.apt:
    name: "{{ backup_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Create the local backup directory
  ansible.builtin.file:
    path: "{{ backup_dir }}"
    state: directory
    mode: "0750"
  become: true

- name: Install the database backup script
  ansible.builtin.template:
    src: backup-tiny-notes-db.sh.j2
    dest: "{{ backup_script_path }}"
    owner: root
    group: root
    mode: "0700"
  become: true
  no_log: true

- name: Schedule the database backup cron job
  ansible.builtin.cron:
    name: tiny-notes database backup
    user: root
    job: "{{ backup_script_path }}"
    hour: "{{ backup_schedule_hour }}"
    minute: "{{ backup_schedule_minute }}"
  become: true
