---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: loadbalancer-instance
    image: geerlingguy/docker-ubuntu2204-ansible:latest
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/..
  inventory:
    group_vars:
      all:
        # HTTP-only for the test: no real domain, so no Let's Encrypt attempt.
        lb_domain: ":80"
        lb_backends:
          - "127.0.0.1"
        loadbalancer_backend_port: 9999
verifier:
  name: ansible
