services:
  mysql:
    image: mysql:8
    container_name: notes-app-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: notes_app
      MYSQL_USER: notes_user
      MYSQL_PASSWORD: notes_password

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build: ./app/backend
    container_name: notes-app-backend
    restart: unless-stopped

    ports:
      - "3000:3000"

    environment:
      DATABASE_URL: mysql://notes_user:notes_password@mysql:3306/notes_app
      PORT: 3000

    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
